<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全新测试页面</title>
    <style>
        body { background: #0f0f23; color: #eaeaea; padding: 20px; font-family: system-ui; }
        .success { color: #4ade80; }
        .error { color: #e94560; }
    </style>
</head>
<body>
    <h1>全新测试页面</h1>
    <p id="status" class="error">加载中...</p>
    
    <script>
try {
    document.getElementById('status').textContent = '✅ 页面加载成功';
    document.getElementById('status').className = 'success';
    
    console.log('基本测试通过!');
    
} catch(e) {
    document.getElementById('status').textContent = '❌ 错误: ' + e.message;
    document.getElementById('status').className = 'error';
    console.error(e);
}
    </script>
</body>
</html>
