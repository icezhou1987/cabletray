<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桥架弯头计算器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --text: #eaeaea;
            --text-secondary: #a0a0b0;
            --border: #2a2a4e;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--primary);
            color: var(--text);
            line-height: 1.6;
        }
        .header {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .header h1 { color: var(--accent); font-size: 1.5rem; }
        .header p { color: var(--text-secondary); font-size: 0.85rem; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        
        .card {
            background: var(--secondary);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }
        .card h2 {
            color: var(--accent);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        
        .grid { display: grid; grid-template-columns: 400px 1fr; gap: 2rem; }
        
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #ff6b6b; transform: translateY(-2px); }
        
        .result-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }
        .result-card {
            background: var(--primary);
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
        }
        .result-card.primary {
            background: linear-gradient(135deg, var(--accent), #c23a50);
        }
        .result-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .result-card.primary .result-label { color: rgba(255,255,255,0.8); }
        .result-value {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        .result-card.primary .result-value { color: white; }
        .result-unit {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }
        
        .viewer {
            background: #0a0a1a;
            border-radius: 8px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .details {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
        }
        .detail-label { color: var(--text-secondary); }
        .detail-value { font-weight: 600; font-family: 'Courier New', monospace; }
        
        footer {
            text-align: center;
            padding: 1.5rem;
            color: #6a6a80;
            font-size: 0.85rem;
        }
        
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .result-grid { grid-template-columns: repeat(2, 1fr); }
            .viewer { height: 300px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>桥架弯头计算器</h1>
        <p>专业电气桥架弯头尺寸计算工具</p>
    </header>
    
    <div class="container">
        <div class="grid">
            <div class="card">
                <h2>参数输入</h2>
                
                <div class="form-group">
                    <label for="elbowType">弯头类型</label>
                    <select id="elbowType" class="form-control" onchange="calculate()">
                        <option value="h90">水平90°弯头</option>
                        <option value="h45">水平45°弯头</option>
                        <option value="h30">水平30°弯头</option>
                        <option value="v90">垂直90°弯头</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="width">桥架宽度 (mm)</label>
                    <input type="number" id="width" class="form-control" value="200" min="50" max="1200" oninput="calculate()">
                </div>
                
                <div class="form-group">
                    <label for="height">桥架高度 (mm)</label>
                    <input type="number" id="height" class="form-control" value="100" min="50" max="400" oninput="calculate()">
                </div>
                
                <div class="form-group">
                    <label for="radius">弯曲半径 (mm)</label>
                    <input type="number" id="radius" class="form-control" value="300" min="100" max="1000" oninput="calculate()">
                </div>
                
                <button class="btn" onclick="calculate()">开始计算</button>
            </div>
            
            <div class="card">
                <h2>3D预览</h2>
                <div class="viewer" id="viewer">
                    <svg viewBox="0 0 400 300" style="width:100%;height:100%">
                        <defs>
                            <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#6a7a8a"/>
                                <stop offset="50%" style="stop-color:#a0b0c0"/>
                                <stop offset="100%" style="stop-color:#7a8a9a"/>
                            </linearGradient>
                            <linearGradient id="cut" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#e94560"/>
                                <stop offset="100%" style="stop-color:#ff6b6b"/>
                            </linearGradient>
                        </defs>
                        
                        <g transform="translate(200,150)">
                            <rect x="-140" y="-55" width="100" height="70" rx="4" fill="url(#metal)" stroke="#4a5a6a" stroke-width="2"/>
                            
                            <path d="M-40 -45 Q70 -90 130 -45" stroke="url(#metal)" stroke-width="45" fill="none"/>
                            <path d="M-40 -25 Q70 20 130 -25" stroke="#5a6a7a" stroke-width="45" fill="none"/>
                            
                            <rect x="-140" y="-20" width="100" height="10" fill="#5a6a7a"/>
                            <rect x="-140" y="-10" width="100" height="10" fill="#6a7a8a"/>
                            <rect x="-140" y="0" width="100" height="10" fill="#5a6a7a"/>
                            
                            <line x1="50" y1="-90" x2="50" y2="20" stroke="url(#cut)" stroke-width="2" stroke-dasharray="6,3"/>
                            <circle cx="50" cy="-35" r="3" fill="#e94560"/>
                            
                            <text x="-120" y="-70" fill="#a0a0b0" font-size="11">入口</text>
                            <text x="80" y="-70" fill="#a0a0b0" font-size="11">出口</text>
                            <text x="55" y="-30" fill="#e94560" font-size="9">切割线</text>
                        </g>
                    </svg>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>计算结果</h2>
            <div class="result-grid">
                <div class="result-card primary">
                    <div class="result-label">展开长度</div>
                    <div class="result-value" id="unfoldLength">471.24</div>
                    <div class="result-unit">mm</div>
                </div>
                <div class="result-card">
                    <div class="result-label">切割位置</div>
                    <div class="result-value" id="cutPosition">100.00</div>
                    <div class="result-unit">mm</div>
                </div>
                <div class="result-card">
                    <div class="result-label">中心弧长</div>
                    <div class="result-value" id="arcLength">471.24</div>
                    <div class="result-unit">mm</div>
                </div>
                <div class="result-card">
                    <div class="result-label">切割角度</div>
                    <div class="result-value" id="cutAngle">45.0</div>
                    <div class="result-unit">°</div>
                </div>
            </div>
            
            <div class="details">
                <div class="detail-row">
                    <span class="detail-label">弯头角度:</span>
                    <span class="detail-value" id="detailAngle">90°</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">弯曲半径:</span>
                    <span class="detail-value" id="detailRadius">300 mm</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">桥架规格:</span>
                    <span class="detail-value" id="detailSpec">200×100 mm</span>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>© 2024 桥架弯头计算器 - 专业计算工具</p>
    </footer>
    
    <script>
const ELBOW_TYPES = {
    h90: { angle: 90, name: '水平90°弯头' },
    h45: { angle: 45, name: '水平45°弯头' },
    h30: { angle: 30, name: '水平30°弯头' },
    v90: { angle: 90, name: '垂直90°弯头' }
};

function calculate() {
    const type = document.getElementById('elbowType').value;
    const width = parseInt(document.getElementById('width').value) || 200;
    const height = parseInt(document.getElementById('height').value) || 100;
    const radius = parseInt(document.getElementById('radius').value) || 300;
    
    const elbow = ELBOW_TYPES[type];
    const angle = elbow.angle;
    const angleRad = (angle * Math.PI) / 180;
    const halfAngleRad = angleRad / 2;
    
    const unfoldLength = angleRad * radius;
    const cutPosition = width - (radius * Math.tan(halfAngleRad));
    const arcLength = angleRad * radius;
    const cutAngle = 90 - (angle / 2);
    
    document.getElementById('unfoldLength').textContent = unfoldLength.toFixed(2);
    document.getElementById('cutPosition').textContent = Math.max(0, cutPosition).toFixed(2);
    document.getElementById('arcLength').textContent = arcLength.toFixed(2);
    document.getElementById('cutAngle').textContent = cutAngle.toFixed(1);
    
    document.getElementById('detailAngle').textContent = angle + '°';
    document.getElementById('detailRadius').textContent = radius + ' mm';
    document.getElementById('detailSpec').textContent = width + '×' + height + ' mm';
}

calculate();
    </script>
</body>
</html>
