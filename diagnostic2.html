<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D诊断测试 - 修复版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { font-family: monospace; background: #0f0f23; color: #eaeaea; padding: 20px; font-size: 14px; }
        .log { background: #1a1a2e; padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 12px; }
        .log.success { color: #4ade80; }
        .log.error { color: #e94560; }
        .log.info { color: #60a5fa; }
        .canvas-container { width: 400px; height: 300px; background: #0a0a1a; border-radius: 8px; }
        button { background: #e94560; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>3D诊断测试 - 修复版</h1>
    
    <div class="log info" id="log1">1. 检查THREE.js是否加载...</div>
    <div class="log info" id="log2">2. 检查WebGL支持...</div>
    <div class="log info" id="log3">3. 创建场景...</div>
    <div class="log info" id="log4">4. 创建相机...</div>
    <div class="log info" id="log5">5. 创建渲染器...</div>
    <div class="log info" id="log6">6. 添加灯光...</div>
    <div class="log info" id="log7">7. 创建几何体...</div>
    <div class="log info" id="log8">8. 渲染场景...</div>
    
    <div class="canvas-container" id="canvas"></div>
    <button onclick="runTest()">运行测试</button>
    
    <script>
function log(id, message, type) {
    var el = document.getElementById(id);
    el.textContent = message;
    el.className = 'log ' + type;
}

function runTest() {
    console.log('开始运行测试...');
    
    log('log1', '1. 检查THREE.js...', 'info');
    if (typeof THREE === 'undefined') {
        log('log1', '❌ THREE.js未定义', 'error');
        console.error('THREE is undefined');
        return;
    }
    log('log1', '✅ THREE.js已加载', 'success');
    console.log('THREE.js版本:', THREE.REVISION);
    
    log('log2', '2. 检查WebGL支持...', 'info');
    var canvas = document.createElement('canvas');
    var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    
    if (!gl) {
        log('log2', '❌ WebGL不可用', 'error');
        console.error('WebGL is not available');
        return;
    }
    log('log2', '✅ WebGL可用', 'success');
    
    log('log3', '3. 创建场景...', 'info');
    try {
        var scene = new THREE.Scene();
        log('log3', '✅ 场景创建成功', 'success');
        console.log('Scene created:', scene);
    } catch (e) {
        log('log3', '❌ 场景创建失败: ' + e.message, 'error');
        console.error('Scene error:', e);
        return;
    }
    
    log('log4', '4. 创建相机...', 'info');
    try {
        var camera = new THREE.PerspectiveCamera(45, 400/300, 0.1, 10000);
        camera.position.set(5, 5, 5);
        camera.lookAt(0, 0, 0);
        log('log4', '✅ 相机创建成功', 'success');
    } catch (e) {
        log('log4', '❌ 相机创建失败: ' + e.message, 'error');
        console.error('Camera error:', e);
        return;
    }
    
    log('log5', '5. 创建渲染器...', 'info');
    try {
        var container = document.getElementById('canvas');
        var renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(400, 300);
        renderer.setClearColor(0x0a0a1a);
        container.innerHTML = '';
        container.appendChild(renderer.domElement);
        log('log5', '✅ 渲染器创建成功', 'success');
    } catch (e) {
        log('log5', '❌ 渲染器创建失败: ' + e.message, 'error');
        console.error('Renderer error:', e);
        return;
    }
    
    log('log6', '6. 添加灯光...', 'info');
    try {
        var ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        var pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);
        log('log6', '✅ 灯光添加成功', 'success');
    } catch (e) {
        log('log6', '❌ 灯光添加失败: ' + e.message, 'error');
        console.error('Light error:', e);
        return;
    }
    
    log('log7', '7. 创建几何体...', 'info');
    try {
        var geometry = new THREE.BoxGeometry(2, 2, 2);
        var material = new THREE.MeshStandardMaterial({ color: 0x8a9ba8, metalness: 0.8, roughness: 0.3 });
        var mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
        log('log7', '✅ 几何体创建成功', 'success');
    } catch (e) {
        log('log7', '❌ 几何体创建失败: ' + e.message, 'error');
        console.error('Mesh error:', e);
        return;
    }
    
    log('log8', '8. 渲染场景...', 'info');
    try {
        renderer.render(scene, camera);
        log('log8', '✅ 场景渲染成功', 'success');
        console.log('渲染成功!');
    } catch (e) {
        log('log8', '❌ 渲染失败: ' + e.message, 'error');
        console.error('Render error:', e);
        return;
    }
    
    console.log('所有测试通过!');
}

document.addEventListener('DOMContentLoaded', function() {
    log('log1', '准备运行测试...', 'info');
    console.log('DOM加载完成, THREE:', typeof THREE);
});
    </script>
</body>
</html>
