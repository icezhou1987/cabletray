<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本测试</title>
    <style>
        body { background: #0f0f23; color: #eaeaea; padding: 20px; font-family: system-ui; }
        .test { padding: 15px; margin: 10px 0; border-radius: 8px; }
        .success { background: rgba(74, 222, 128, 0.1); color: #4ade80; border: 1px solid #4ade80; }
        .error { background: rgba(233, 69, 96, 0.1); color: #e94560; border: 1px solid #e94560; }
        .info { background: rgba(96, 165, 250, 0.1); color: #60a5fa; border: 1px solid #60a5fa; }
    </style>
</head>
<body>
    <h1>基本功能测试</h1>
    
    <div class="test info" id="test1">测试1: 页面加载...</div>
    <div class="test info" id="test2">测试2: JavaScript执行...</div>
    <div class="test info" id="test3">测试3: DOM操作...</div>
    <div class="test info" id="test4">测试4: 计算功能...</div>
    
    <script>
document.getElementById('test1').textContent = '✅ 测试1: 页面加载成功';
document.getElementById('test1').className = 'test success';

try {
    document.getElementById('test2').textContent = '✅ 测试2: JavaScript执行成功';
    document.getElementById('test2').className = 'test success';
    
    var newDiv = document.createElement('div');
    newDiv.textContent = 'DOM操作成功';
    newDiv.className = 'test success';
    document.body.appendChild(newDiv);
    document.getElementById('test3').textContent = '✅ 测试3: DOM操作成功';
    document.getElementById('test3').className = 'test success';
    
    var result = 2 + 3;
    document.getElementById('test4').textContent = '✅ 测试4: 计算功能成功 (2 + 3 = ' + result + ')';
    document.getElementById('test4').className = 'test success';
    
} catch(e) {
    document.getElementById('test2').textContent = '❌ 测试失败: ' + e.message;
    document.getElementById('test2').className = 'test error';
    console.error(e);
}
    </script>
</body>
</html>
