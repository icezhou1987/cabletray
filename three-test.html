<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 加载测试</title>
    <style>
        body { font-family: system-ui; background: #1a1a2e; color: #eaeaea; padding: 20px; }
        .log { padding: 10px; margin: 5px 0; border-radius: 4px; font-family: monospace; font-size: 14px; }
        .success { background: rgba(74, 222, 128, 0.1); color: #4ade80; border: 1px solid #4ade80; }
        .error { background: rgba(233, 69, 96, 0.1); color: #e94560; border: 1px solid #e94560; }
        .info { background: rgba(96, 165, 250, 0.1); color: #60a5fa; border: 1px solid #60a5fa; }
        .canvas { width: 400px; height: 300px; background: #0a0a1a; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Three.js 加载测试</h1>
    
    <div class="log info" id="log1">1. 检查THREE对象...</div>
    <div class="log info" id="log2">2. 创建场景...</div>
    <div class="log info" id="log3">3. 添加对象...</div>
    <div class="log info" id="log4">4. 渲染场景...</div>
    
    <div class="canvas" id="canvas"></div>
    
    <script>
function log(id, msg, type) {
    document.getElementById(id).textContent = msg;
    document.getElementById(id).className = 'log ' + type;
    console.log(msg);
}

function loadScript(url, callback) {
    var script = document.createElement('script');
    script.type = 'text/javascript';
    script.crossOrigin = 'anonymous';
    
    script.onload = function() {
        log('log1', '✅ 脚本加载成功: ' + url.split('/').pop(), 'success');
        callback(null);
    };
    
    script.onerror = function(err) {
        log('log1', '❌ 脚本加载失败: ' + url.split('/').pop(), 'error');
        callback(err);
    };
    
    script.src = url;
    document.head.appendChild(script);
}

var THREE = null;

loadScript('https://unpkg.com/three@0.128.0/build/three.min.js', function(err) {
    if (err) {
        log('log1', '❌ Three.js加载失败', 'error');
        return;
    }
    
    THREE = window.THREE;
    log('log1', '✅ THREE对象: ' + typeof THREE, 'success');
    
    try {
        log('log2', '创建场景...', 'info');
        var scene = new THREE.Scene();
        log('log2', '✅ 场景创建成功', 'success');
        
        log('log3', '创建相机...', 'info');
        var camera = new THREE.PerspectiveCamera(75, 400/300, 0.1, 1000);
        camera.position.z = 5;
        log('log3', '✅ 相机创建成功', 'success');
        
        log('log3', '创建渲染器...', 'info');
        var renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(400, 300);
        renderer.setClearColor(0x0a0a1a);
        document.getElementById('canvas').appendChild(renderer.domElement);
        log('log3', '✅ 渲染器创建成功', 'success');
        
        log('log3', '创建立方体...', 'info');
        var geometry = new THREE.BoxGeometry(1, 1, 1);
        var material = new THREE.MeshBasicMaterial({ color: 0xe94560 });
        var cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        log('log3', '✅ 立方体添加到场景', 'success');
        
        log('log4', '开始渲染...', 'info');
        renderer.render(scene, camera);
        log('log4', '✅ 渲染成功!', 'success');
        
        animate();
        
    } catch(e) {
        log('log2', '❌ 错误: ' + e.message, 'error');
        console.error(e);
    }
});

function animate() {
    requestAnimationFrame(animate);
}
    </script>
</body>
</html>
